[package]
name = "supru-core"
version = "0.1.0"
edition = "2021"
description = "Supru AI - Rust Authority Execution Layer"

[lib]
name = "supru_core"
path = "src/lib.rs"

[[bin]]
name = "supru"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-updater = { version = "2.0", optional = true }
tauri-plugin-sentry = { version = "0.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.0"
notify = "6.0"
portable-pty = "0.9"
git2 = "0.18"
surrealdb = { version = "1.0", features = ["kv-mem"] }
z3 = { version = "0.11", optional = true }
mojo = { version = "0.1", optional = true }
dirs = "5.0"
sha2 = "0.10"
ring = { version = "0.17", features = ["std"] }
base64 = "0.21"
parking_lot = "0.12"
semver = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
updater = ["tauri-plugin-updater"]
sentry = ["tauri-plugin-sentry"]
