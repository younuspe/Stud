# Optional local production stack: app + Redis-backed rate limiting.
#   SUPRU_ACCESS_TOKEN=$(openssl rand -hex 24) docker compose up --build
# The app is served at http://localhost:3000. A production server bound to
# 0.0.0.0 refuses to start without SUPRU_ACCESS_TOKEN, so provide one (or set
# SUPRU_ALLOW_INSECURE_PUBLIC=1 for a trusted, isolated host).
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      SUPRU_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      # Required by the container's 0.0.0.0 bind. Generate with:
      #   openssl rand -hex 24
      SUPRU_ACCESS_TOKEN: ${SUPRU_ACCESS_TOKEN:?set SUPRU_ACCESS_TOKEN, e.g. openssl rand -hex 24}
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      # GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    restart: unless-stopped
