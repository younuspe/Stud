name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Production boot smoke test
        run: |
          PORT=3100 NODE_ENV=production SUPRU_HOST=127.0.0.1 node --import tsx server.ts &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null 2>&1; then
              echo "health OK"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/health
          kill $SERVER_PID
