name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # Required for the agent to push PR fixes natively
      issues: write   # Required to read issue description fields
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true # Crucial: set to true so agent can commit code changes

      - name: Run OpenCode with NVIDIA Backend
        uses: anomalyco/opencode/github@latest
        env:
          # 1. Map your safe environment secret key
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # 2. Fix the client endpoint routing bug directly inside the runner environment
          OPENAI_BASE_URL: https://nvidia.com
        with:
          # Use the verified optimization model identifier string
          model: nvidia/nemotron-3.5-lightning-30b
