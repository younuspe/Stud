name: macOS desktop build

# Manual-only after the explicitly requested verification run.
# Do not build automatically on each code commit.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/desktop-app-launch
    paths:
      - src/lib.rs

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Convert cat icon to RGBA PNG for Tauri
        run: |
          python3 -m venv .venv-icon
          .venv-icon/bin/python -m pip install --upgrade pip Pillow
          mkdir -p icons
          .venv-icon/bin/python - <<'PY'
          from PIL import Image
          source = Image.open("src/assets/images/cat_icon.jpg")
          icon = source.convert("RGBA")
          icon.save("icons/icon.png", format="PNG")
          check = Image.open("icons/icon.png")
          if check.mode != "RGBA":
              raise SystemExit(f"Expected RGBA icon, got {check.mode}")
          print(f"Verified icons/icon.png: mode={check.mode}, size={check.size}")
          PY

      - name: Build unsigned macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: supru-ai-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
