name: macOS desktop build

# Build on product-contract, provider, UI, Rust, and packaging changes so regressions are caught before merging.
on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/native-generative-studio
      - rebuild/native-coding-core
      - fix/desktop-app-launch
      - fix/macos-app-bundle-signature
      - fix/functional-implementation-audit
    paths:
      - src/lib.rs
      - tauri.conf.json
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - server.ts
      - build.rs
      - .github/workflows/macos-desktop.yml
      - PRODUCT_SPEC.md
      - ROADMAP.md
      - SKILL.md
      - CLAUDE.md
      - README.md
      - AUDIT_REPORT.md
      - src/**/*.tsx
      - src/**/*.ts

concurrency:
  group: supru-functional-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Validate desktop configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("tauri.conf.json")
          config = json.loads(path.read_text())
          fs = config.get("plugins", {}).get("fs", {})
          if "scope" in fs:
              raise SystemExit("Invalid Tauri v2 config: plugins.fs.scope must not be in tauri.conf.json")
          minimum = config.get("bundle", {}).get("macOS", {}).get("minimumSystemVersion")
          if not minimum or tuple(map(int, minimum.split("."))) < (11, 0):
              raise SystemExit(f"Apple Silicon build must declare macOS 11.0 or newer; found {minimum!r}")
          csp = config.get("app", {}).get("security", {}).get("csp", "")
          if "worker-src 'self' blob:" not in csp or "child-src 'self' blob:" not in csp:
              raise SystemExit("Desktop CSP must explicitly allow bundled Monaco workers.")
          monaco_setup = Path("src/monacoSetup.ts").read_text()
          if "loader.config({ monaco })" not in monaco_setup or "?worker" not in monaco_setup:
              raise SystemExit("Monaco must use the bundled npm package and Vite worker bundles, not the CDN loader.")
          print(f"Validated {path}: plugins.fs={fs}, macOS minimum={minimum}, local Monaco workers configured")
          PY

      - name: Install frontend dependencies from lockfile
        run: npm ci --legacy-peer-deps

      - name: Type-check provider server
        run: npm run lint:server

      - name: Type-check frontend
        run: npm run lint

      - name: Test shared provider resolution
        run: npm run test:providers

      - name: Convert cat icon to RGBA PNG for Tauri
        run: |
          python3 -m venv .venv-icon
          .venv-icon/bin/python -m pip install --upgrade pip Pillow
          mkdir -p icons
          .venv-icon/bin/python - <<'PY'
          from PIL import Image
          source = Image.open("src/assets/images/cat_icon.jpg")
          icon = source.convert("RGBA")
          icon.save("icons/icon.png", format="PNG")
          check = Image.open("icons/icon.png")
          if check.mode != "RGBA":
              raise SystemExit(f"Expected RGBA icon, got {check.mode}")
          print(f"Verified icons/icon.png: mode={check.mode}, size={check.size}")
          PY

      - name: Run Rust provider URL regression tests
        run: cargo test --locked

      - name: Build frontend bundle
        run: npm run build

      - name: Build unsigned macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Verify available signature and smoke-test packaged app
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          DMG="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rm -rf "$MOUNT_DIR"
          }
          trap cleanup EXIT
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          if codesign -dv --verbose=2 "$APP_PATH" > /tmp/supru-codesign-info.txt 2>&1; then
            cat /tmp/supru-codesign-info.txt
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          else
            echo "Unsigned desktop bundle detected; this is expected for the no-signing-credentials build."
            cat /tmp/supru-codesign-info.txt || true
          fi
          APP_BIN="$APP_PATH/Contents/MacOS/supru"
          test -x "$APP_BIN"
          python3 - "$APP_BIN" <<'PY'
          import subprocess
          import sys

          executable = sys.argv[1]
          process = subprocess.Popen(
              [executable],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              env=None,
          )
          try:
              output, _ = process.communicate(timeout=12)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  output, _ = process.communicate(timeout=3)
              except subprocess.TimeoutExpired:
                  process.kill()
                  output, _ = process.communicate()
              if output:
                  print(output)
              print("PASS: packaged app remained running for 12 seconds; no immediate startup panic.")
              raise SystemExit(0)

          if output:
              print(output)
          raise SystemExit(
              f"FAIL: packaged app exited before the 12-second startup window (exit={process.returncode})."
          )
          PY

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supru-ai-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
