name: macOS desktop build

# Manual dispatch remains available. A scoped push trigger is enabled for this authorized verification run
# on the active repair branch; only relevant source/config/workflow changes trigger a build.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/desktop-app-launch
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tauri.conf.json'
      - '.github/workflows/macos-desktop.yml'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build unsigned macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: supru-ai-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
