name: macOS desktop build

# Manual-only after the explicitly requested verification run.
# Do not build automatically on each code commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Convert cat icon to a real PNG for Tauri
        run: |
          mkdir -p icons
          sips -s format png src/assets/images/cat_icon.png --out icons/icon.png

      - name: Build unsigned macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: supru-ai-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
